# ─────────────────────────────────────────
# Browser
# ─────────────────────────────────────────
browser=chromium
headless=true
timeout.ms=10000

# ─────────────────────────────────────────
# Retry (flaky-test retry — TimeoutError only)
# ─────────────────────────────────────────
retry.max=2

# ─────────────────────────────────────────
# Smoke-first execution
# Set to true to run only tests tagged "smoke" — used as the fast gate on push/PR.
# Override at runtime: -Dsmoke.only=true  |  SMOKE_ONLY=true (Docker/CI)
# ─────────────────────────────────────────
smoke.only=false

# ─────────────────────────────────────────
# Allure environment label
# ─────────────────────────────────────────
allure.environment.name=local

# ─────────────────────────────────────────
# Quality Gates
# QualityGateChecker enforces these thresholds after each suite.
# Override per-suite via system property: -Dquality.gate.min.pass.pct=90
# CI pipelines check for target/quality-gate-failure.txt to fail the build.
# ─────────────────────────────────────────
quality.gate.min.pass.pct=80
quality.gate.max.flake.pct=20